name: Build in Amazon Linux container

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'

jobs:
  build:
    runs-on: ubuntu-24.04${{ (matrix.arch == 'arm64' && '-arm') || (matrix.arch == 'x86_64' && '') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, arm64 ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f .github/Dockerfile .

